<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password &mdash; Master Key Genie</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="assets/favicon.png?v=20260808" type="image/png" />
    <link rel="stylesheet" href="css/styles.css?v=8" />
    <style>
      .reset-gate {
        min-height: calc(100vh - 5.25rem);
        display: grid;
        place-items: center;
        padding: 2.5rem 1.25rem 4rem;
      }
      .reset-card {
        width: min(32rem, 100%);
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 2rem 1.5rem 1.75rem;
        text-align: center;
      }
      .reset-card h1 {
        margin: 0 0 0.75rem;
        font-size: 1.85rem;
      }
      .reset-card p {
        margin: 0 0 1.25rem;
        color: var(--ink-muted);
        font-size: 1.05rem;
      }
      .reset-card .btn[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="nav-inner">
        <a class="brand-lockup" href="index.html" aria-label="Master Key Genie home">
          <img src="assets/brand-mark.png?v=20260808" alt="" width="58" height="58" />
          <span>Master Key <span class="genie">Genie</span></span>
        </a>
      </div>
    </header>

    <main class="reset-gate">
      <section class="reset-card">
        <h1>Reset your password</h1>
        <p id="status">Opening Master Key Genie…</p>
        <a id="open-app" class="btn btn-sky" hidden>Open Master Key Genie</a>
      </section>
    </main>

    <script>
      (function () {
        var hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        var query = new URLSearchParams(location.search);
        function pick(name) {
          return hash.get(name) || query.get(name) || '';
        }
        var errorText = pick('error_description') || pick('error');
        var errorCode = pick('error_code');
        var access = pick('access_token');
        var refresh = pick('refresh_token');
        var type = pick('type') || 'recovery';
        var code = pick('code');
        if (location.hash || /access_token|refresh_token|error/.test(location.search)) {
          history.replaceState(null, '', location.pathname);
        }

        var status = document.getElementById('status');
        var open = document.getElementById('open-app');

        function expired(text) {
          return /otp_expired|expired|invalid|already/i.test(text);
        }

        if ((errorText || errorCode) && !access && !code) {
          status.textContent = expired(errorCode + ' ' + errorText)
            ? 'This reset link has expired or was already used. Open the app and use Forgot password to send a new one.'
            : 'This reset link could not be opened. Open the app and use Forgot password to send a new one.';
          return;
        }

        if (!access && !refresh && !code) {
          status.textContent =
            'Open the password reset link from your email on the phone or PC where Master Key Genie is installed.';
          return;
        }

        var params = new URLSearchParams();
        if (access && refresh) {
          params.set('access_token', access);
          params.set('refresh_token', refresh);
          params.set('type', type);
        } else if (code) {
          params.set('code', code);
          params.set('type', type);
        }
        var isWindowsPc =
          /Windows NT/i.test(navigator.userAgent) &&
          !/Windows Phone|Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
        var href =
          (isWindowsPc
            ? 'masterkeygenie://reset-password?'
            : 'keymaster://reset-password?') + params.toString();
        open.href = href;
        open.hidden = false;
        status.textContent = isWindowsPc
          ? 'Choose a new password in Master Key Genie. If it does not open, click the button on this PC.'
          : 'Choose a new password in the app. If it does not open, tap the button on the phone where Master Key Genie is installed.';
        try {
          location.assign(href);
        } catch (err) {
          /* The button stays on the page. */
        }
      })();
    </script>
  </body>
</html>
